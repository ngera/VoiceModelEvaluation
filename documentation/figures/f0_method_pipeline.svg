<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 300" width="1240" height="300" role="img"
     aria-label="Method pipeline. A 75-item corpus across two use cases goes to eight vendors with pre-registered model and voice, producing 1,200 audio files per campaign, run twice three weeks apart. Audio is loudness-normalised, then scored in parallel by four analyzers: Audiobox for PQ and CE, DNSMOS for P.808 and P.835, two ASR judges for agreement word error rate, and a hygiene pass for clipping, loudness and noise floor. All four feed gates that were committed before results, which produce the findings.">
  <style>
    .bg   { fill: #ffffff; }
    .box  { fill: #f4f6f8; stroke: #c3ccd4; stroke-width: 1.25; }
    .boxa { fill: #eef5f2; stroke: #9cc4b6; stroke-width: 1.25; }
    .note { fill: none; stroke: #b4bfc9; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .t    { fill: #15202b; font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 14px; }
    .tb   { font-weight: 600; }
    .ts   { font-size: 12px; fill: #5b6873; }
    .arr  { stroke: #8795a1; stroke-width: 1.4; fill: none; }
    .arrd { stroke: #8795a1; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0f1419; }
      .box  { fill: #182028; stroke: #2f3d49; }
      .boxa { fill: #16241f; stroke: #2f5a4b; }
      .note { stroke: #3a4752; }
      .t    { fill: #e6edf3; }
      .ts   { fill: #93a3b1; }
      .arr, .arrd { stroke: #7d8d9c; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8795a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1240" height="300" rx="10"/>

  <!-- main chain -->
  <rect class="box" x="16"  y="120" width="136" height="60" rx="8"/>
  <text class="t tb" x="84"  y="145" text-anchor="middle">75-item corpus</text>
  <text class="t ts" x="84"  y="164" text-anchor="middle">× 2 use cases</text>

  <rect class="box" x="180" y="120" width="146" height="60" rx="8"/>
  <text class="t tb" x="253" y="145" text-anchor="middle">8 vendors</text>
  <text class="t ts" x="253" y="164" text-anchor="middle">model + voice pinned</text>

  <rect class="box" x="354" y="120" width="146" height="60" rx="8"/>
  <text class="t tb" x="427" y="145" text-anchor="middle">1,200 audio files</text>
  <text class="t ts" x="427" y="164" text-anchor="middle">per campaign</text>

  <rect class="note" x="354" y="198" width="146" height="40" rx="8"/>
  <text class="t ts" x="427" y="215" text-anchor="middle">× 2 campaigns,</text>
  <text class="t ts" x="427" y="231" text-anchor="middle">3 weeks apart</text>
  <path class="arrd" d="M427 198 L427 180"/>

  <rect class="box" x="528" y="120" width="132" height="60" rx="8"/>
  <text class="t tb" x="594" y="145" text-anchor="middle">Loudness</text>
  <text class="t ts" x="594" y="164" text-anchor="middle">normalisation</text>

  <!-- analyzers -->
  <rect class="boxa" x="688" y="40"  width="196" height="46" rx="8"/>
  <text class="t tb" x="786" y="60"  text-anchor="middle">Audiobox</text>
  <text class="t ts" x="786" y="77"  text-anchor="middle">PQ · CE</text>

  <rect class="boxa" x="688" y="98"  width="196" height="46" rx="8"/>
  <text class="t tb" x="786" y="118" text-anchor="middle">DNSMOS</text>
  <text class="t ts" x="786" y="135" text-anchor="middle">P.808 · P.835</text>

  <rect class="boxa" x="688" y="156" width="196" height="46" rx="8"/>
  <text class="t tb" x="786" y="176" text-anchor="middle">Two ASR judges</text>
  <text class="t ts" x="786" y="193" text-anchor="middle">agreement WER</text>

  <rect class="boxa" x="688" y="214" width="196" height="46" rx="8"/>
  <text class="t tb" x="786" y="234" text-anchor="middle">Hygiene</text>
  <text class="t ts" x="786" y="251" text-anchor="middle">clipping · LUFS · floor</text>

  <!-- gates + findings -->
  <rect class="box" x="912" y="120" width="140" height="60" rx="8"/>
  <text class="t tb" x="982" y="145" text-anchor="middle">Gates</text>
  <text class="t ts" x="982" y="164" text-anchor="middle">set before results</text>

  <rect class="box" x="1080" y="120" width="140" height="60" rx="8"/>
  <text class="t tb" x="1150" y="145" text-anchor="middle">Findings</text>
  <text class="t ts" x="1150" y="164" text-anchor="middle">pass / fail, per axis</text>

  <!-- arrows along the chain -->
  <path class="arr" d="M152 150 L178 150" marker-end="url(#a)"/>
  <path class="arr" d="M326 150 L352 150" marker-end="url(#a)"/>
  <path class="arr" d="M500 150 L526 150" marker-end="url(#a)"/>

  <!-- fan out to the four analyzers -->
  <path class="arr" d="M660 150 C676 150 672 63 686 63"   marker-end="url(#a)"/>
  <path class="arr" d="M660 150 C676 150 672 121 686 121" marker-end="url(#a)"/>
  <path class="arr" d="M660 150 C676 150 672 179 686 179" marker-end="url(#a)"/>
  <path class="arr" d="M660 150 C676 150 672 237 686 237" marker-end="url(#a)"/>

  <!-- converge to the gates -->
  <path class="arr" d="M884 63  C898 63  896 150 910 150" marker-end="url(#a)"/>
  <path class="arr" d="M884 121 C898 121 896 150 910 150" marker-end="url(#a)"/>
  <path class="arr" d="M884 179 C898 179 896 150 910 150" marker-end="url(#a)"/>
  <path class="arr" d="M884 237 C898 237 896 150 910 150" marker-end="url(#a)"/>

  <path class="arr" d="M1052 150 L1078 150" marker-end="url(#a)"/>
</svg>
