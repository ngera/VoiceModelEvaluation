<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Voice AI evaluation harness — system architecture</title>
  <desc id="desc">Block diagram: CLI and Streamlit admin panel share one implementation; pre-registered config and vendor adapters feed the async runner; the runner writes an immutable run store; analyzers are pure functions of that store and feed the deferred Bradley-Terry rating pipeline.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6570"/>
    </marker>
    <style><![CDATA[
      .lane { fill: #f4f6f8; stroke: #c9d0d6; stroke-width: 1.25; }
      .box { fill: #ffffff; stroke: #2f3a44; stroke-width: 1.5; }
      .box-accent { fill: #eef3f8; stroke: #2f3a44; stroke-width: 1.5; }
      .box-store { fill: #f7f1e8; stroke: #2f3a44; stroke-width: 1.5; }
      .box-defer { fill: #f3f3f3; stroke: #7a8490; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .lane-label { font: 700 13px "Segoe UI", system-ui, sans-serif; fill: #1f2933; }
      .title { font: 700 12.5px "Segoe UI", system-ui, sans-serif; fill: #1f2933; }
      .body { font: 400 11px "Segoe UI", system-ui, sans-serif; fill: #3e4a54; }
      .tiny { font: 400 10px "Segoe UI", system-ui, sans-serif; fill: #5b6570; }
      .flow { stroke: #5b6570; stroke-width: 1.75; fill: none; marker-end: url(#arrow); }
      .caption { font: 400 11.5px "Segoe UI", system-ui, sans-serif; fill: #5b6570; }
    ]]></style>
  </defs>

  <rect width="960" height="760" fill="#ffffff"/>

  <!-- FRONT -->
  <rect class="lane" x="24" y="20" width="420" height="140" rx="10"/>
  <text class="lane-label" x="40" y="44">Two front doors — one implementation</text>

  <rect class="box" x="40" y="58" width="188" height="86" rx="6"/>
  <text class="title" x="52" y="80">CLI · veval</text>
  <text class="body" x="52" y="100">doctor · generate · analyze</text>
  <text class="body" x="52" y="116">score · report</text>
  <text class="tiny" x="52" y="134">Typer entry points</text>

  <rect class="box" x="240" y="58" width="188" height="86" rx="6"/>
  <text class="title" x="252" y="80">Admin panel · Streamlit</text>
  <text class="body" x="252" y="100">Doctor · Run · Results · Rate</text>
  <text class="body" x="252" y="116">Frontier*</text>
  <text class="tiny" x="252" y="134">*thin wrapper; never duplicates logic</text>

  <!-- CONFIG -->
  <rect class="lane" x="460" y="20" width="232" height="140" rx="10"/>
  <text class="lane-label" x="476" y="44">Pre-registered config</text>

  <rect class="box-accent" x="476" y="58" width="200" height="86" rx="6"/>
  <text class="body" x="488" y="78">providers · voices · gates</text>
  <text class="body" x="488" y="94">corpus · analyzers · pricing</text>
  <text class="tiny" x="488" y="116">git-tagged before results</text>
  <text class="tiny" x="488" y="132">Pydantic v2 · extra=forbid</text>

  <!-- ADAPTERS -->
  <rect class="lane" x="708" y="20" width="228" height="140" rx="10"/>
  <text class="lane-label" x="724" y="44">Vendor adapters</text>

  <rect class="box-accent" x="724" y="58" width="196" height="86" rx="6"/>
  <text class="title" x="736" y="80">synthesize(text, opts)</text>
  <text class="body" x="736" y="100">→ audio · ttfa · chars · meta</text>
  <text class="tiny" x="736" y="120">8 vendors · one file each</text>
  <text class="tiny" x="736" y="136">common interface</text>

  <!-- RUNNER -->
  <rect class="lane" x="24" y="196" width="912" height="92" rx="10"/>
  <text class="lane-label" x="40" y="220">Runner — veval generate</text>

  <rect class="box" x="40" y="232" width="880" height="40" rx="6"/>
  <text class="title" x="56" y="250">Async orchestrator</text>
  <text class="body" x="200" y="250">httpx · retry · rate limits · content-hash cache · spend cap · errors-as-data · campaign / variance / latency</text>

  <!-- STORE -->
  <rect class="lane" x="24" y="324" width="912" height="110" rx="10"/>
  <text class="lane-label" x="40" y="348">Immutable run store — runs/&lt;run_id&gt;/</text>

  <rect class="box-store" x="40" y="362" width="280" height="54" rx="6"/>
  <text class="title" x="52" y="384">manifest.json</text>
  <text class="tiny" x="52" y="402">date · env pins · hardware</text>

  <rect class="box-store" x="340" y="362" width="280" height="54" rx="6"/>
  <text class="title" x="352" y="384">audio/&lt;provider&gt;/…/*.wav</text>
  <text class="tiny" x="352" y="402">never mutated in place</text>

  <rect class="box-store" x="640" y="362" width="280" height="54" rx="6"/>
  <text class="title" x="652" y="384">api_log.jsonl</text>
  <text class="tiny" x="652" y="402">timings · usage · errors</text>

  <!-- ANALYZERS -->
  <rect class="lane" x="24" y="470" width="912" height="140" rx="10"/>
  <text class="lane-label" x="40" y="494">Analyzers — pure functions of the run store</text>

  <rect class="box" x="40" y="508" width="136" height="82" rx="6"/>
  <text class="title" x="52" y="530">acceptance</text>
  <text class="tiny" x="52" y="548">WAV / LUFS / VAD</text>
  <text class="tiny" x="52" y="564">hygiene · latency</text>
  <text class="tiny" x="52" y="580">cost</text>

  <rect class="box" x="188" y="508" width="136" height="82" rx="6"/>
  <text class="title" x="200" y="530">wer</text>
  <text class="tiny" x="200" y="548">two-judge ASR</text>
  <text class="tiny" x="200" y="564">agreement rule</text>

  <rect class="box" x="336" y="508" width="160" height="82" rx="6"/>
  <text class="title" x="348" y="530">quality</text>
  <text class="tiny" x="348" y="548">Audiobox · DNSMOS</text>
  <text class="tiny" x="348" y="564">optional TTSDS2</text>

  <rect class="box" x="508" y="508" width="136" height="82" rx="6"/>
  <text class="title" x="520" y="530">cross_metric</text>
  <text class="tiny" x="520" y="548">Spearman ρ</text>
  <text class="tiny" x="520" y="564">across 6 signals</text>

  <rect class="box" x="656" y="508" width="136" height="82" rx="6"/>
  <text class="title" x="668" y="530">variance</text>
  <text class="tiny" x="668" y="548">noise floor</text>
  <text class="tiny" x="668" y="564">determinism</text>

  <rect class="box" x="804" y="508" width="116" height="82" rx="6"/>
  <text class="title" x="816" y="530">drift</text>
  <text class="tiny" x="816" y="548">loudness /</text>
  <text class="tiny" x="816" y="564">spectral thirds</text>

  <!-- RATING -->
  <rect class="lane" x="24" y="646" width="912" height="66" rx="10"/>
  <text class="lane-label" x="40" y="670">Rating pipeline (D4 — deferred)</text>

  <rect class="box-defer" x="280" y="656" width="400" height="42" rx="6"/>
  <text class="title" x="300" y="674">rate build / score — Bradley-Terry</text>
  <text class="tiny" x="300" y="690">bootstrap CIs · consistency re-judge · D-H blocked in v1</text>

  <!-- Flows -->
  <path class="flow" d="M134 160 V196"/>
  <path class="flow" d="M334 160 V196"/>
  <path class="flow" d="M576 160 V196"/>
  <path class="flow" d="M822 160 V196"/>
  <path class="flow" d="M480 288 V324"/>
  <path class="flow" d="M480 434 V470"/>
  <path class="flow" d="M480 610 V646"/>

  <text class="caption" x="24" y="740">Front doors call the same generate / analyze / score functions. Config pins model+voice+gates before results exist. Analyzers re-run without regenerating audio.</text>
</svg>
