# capabilities.yaml — D8 capability audit per spec §A.8
#
# "Desk research against official docs, ~30 minutes per provider,
#  recorded as a ✓/✗/partial matrix with a source link and date per cell.
#  No scoring — facts, not judgments." — spec §A.8
#
# Same per-cell provenance shape as `configs/pricing.yaml`:
#   value        one of: yes | no | partial
#   source_url   canonical vendor doc / API reference URL
#   date_verified YYYY-MM-DD the cell was last read against the source
#
# Three rules (per 02 § D8):
#   (1) FACTS, NOT JUDGMENTS — no "good/poor", just the value + where read.
#   (2) DATE EVERY CELL — vendor feature pages change faster than findings.
#       An undated ✓ is worthless in six months.
#   (3) USE `partial` HONESTLY — where a capability exists but sits
#       behind an enterprise tier not bought, record `partial` with the
#       tier named in `notes`; never `no`. That distinction is what a
#       procurement reader actually needs.
#
# Cells sourced from artifacts already in this repo (F-1, pricing.yaml,
# providers.yaml, voices.yaml, D-008) are dated to their source-artifact's
# `date_verified` where present, or to the R3 campaign date 2026-08-31 as
# the "measurement-day" fallback. Cells marked `TODO_desk_research` need
# the docs read against the vendor's live page and dated on read.
#
# Ships as `prereg-v1.11` amendment: adding this file does not change any
# other pre-registered artifact; it fills the D8 dimension the spec
# committed to and closes the commercial_use_permitted gate's evidence
# gap (04:1181, previously "asserted, not evidenced").

# Nine columns per spec §A.8 — one row per (vendor, column) so a
# capability sweep is one YAML file to read.
