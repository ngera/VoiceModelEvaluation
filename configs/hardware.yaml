# Numeric-identity claim (spec §5.4 + RESEARCH_LOG D-F).
# Every analyzer output in this campaign is a deterministic function of
# audio bytes + code. Same audio + same code + different hardware
# (GPU, different CPU model, etc.) = same scores up to fp32/fp16
# precision differences that do not accumulate into meaningful
# ranking changes. Wall-clock differs (see analyzer_walltime_notes below).
numeric_identity_claim: |
  Analyzer outputs (WER, Audiobox/UTMOS/NISQA scores, hygiene metrics,
  variance rollups, drift flags) are deterministic ML inference or
  signal processing on identical audio bytes. Reproducers on GPU or
  different CPU should observe:
    - Bit-exact CPU-to-CPU on the same torch build
    - Near-exact (within ~1e-4 for float scores) CPU-to-GPU due to
      reduced-precision math on GPU. No effect on provider RANKING.
    - Bit-exact for jiwer WER computation regardless of judge inference
      hardware
  Client-side latency (TTFA, RTF) is environment-dependent and NOT
  covered by this identity claim; see D-G for enterprise-portability
  discussion.

# Reference wall-clock times observed during the actual campaign.
# For reproducer planning only; not a benchmark claim.
analyzer_walltime_notes:
  acceptance: "5-10 min for 1200 files"
  hygiene: "5-10 min for 1200 files"
  latency: "seconds (JSON parsing only)"
  cost: "seconds (arithmetic only)"
  wer: "overnight on CPU (1200 files × 2 judges); estimated 30-40 min on mid-tier GPU"
  quality_audiobox: "~5 min for 1200 files"
  quality_utmos: "estimated 20-40 min for 1200 files on CPU (TBD post-Phase-2b)"
  quality_nisqa: "estimated 20-40 min for 1200 files on CPU (TBD post-Phase-2b)"
  variance: "seconds (hashing + numpy)"
  drift: "1-2 min for 64 long-narration items"
  generation_campaign: "~1 hour for 1200 fresh API calls at documented concurrency (mostly waiting on providers, not compute)"

# Reproducer guidance — the "what to budget" answer.
reproducer_notes: |
  Full re-analysis of a campaign run on CPU: budget ~overnight for WER,
  ~1 hour for quality with UTMOS+NISQA (post-Phase-2b), remaining
  stages together <10 min. Full re-analysis on a mid-tier GPU: budget
  ~1-1.5 hours end-to-end.

  Fresh generation campaign requires API keys + credits at all 8
  providers (~$20 up front per the runbook Phase 0 credit checklist)
  plus ~1 hour of wall-clock for the 1200-file synthesis.

  Bradley-Terry rating campaign (Phase 3 revised, D-011): ~1.5 hours
  of active listening across 2-3 sessions. No hardware requirement
  beyond a machine that runs the static HTML rating page.
