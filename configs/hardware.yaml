# hardware.yaml — measurement environment (D7 + reproducibility receipt)
#
# Written 2026-08-10 per RESEARCH_LOG.md D-F + D-G. This is the environment
# every result in the report was measured from. Committed alongside
# analysis/*.json so a reviewer can attribute any observed effect to
# either the harness or the compute environment, not to unstated
# uncertainty.
#
# Fields marked TODO_FILL_IN are placeholders — populate with the
# actual laptop specs before the final report ships. Not load-bearing
# for correctness; load-bearing for the reproducibility claim.

platform:
  os: "Windows 11 Home 10.0.26200"
  cpu_model: "TODO_FILL_IN"          # e.g. "AMD Ryzen 7 5800H" or "Intel i7-11800H"
  cpu_cores: TODO_FILL_IN            # e.g. 8 physical / 16 logical
  cpu_base_ghz: TODO_FILL_IN         # e.g. 3.2
  ram_gb: TODO_FILL_IN               # e.g. 16
  gpu: "none (CPU-only torch build; no CUDA wheels selected)"
