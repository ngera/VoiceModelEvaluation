# not pre-registered. `DEFAULT_PROVIDER_CONCURRENCY` in
# `src/veval/runner/runner.py` is the source of truth.
provider_concurrency:
  deepgram: 3
  fish: 3
  google: 5
  cartesia: 2                         # Pro tier concurrency cap
  elevenlabs: 3
  openai: 5
  speechify: 1                        # Starter tier limit (verified via HTTP 429 body 2026-08-08)
