    jiwer: "3.x"
    pyloudnorm: "0.1.x"
    scipy: "1.17.x"
    numpy: "1.26+"
    choix: "0.4.x"                   # Bradley-Terry
    altair: "6.2.2"
    vl_convert_python: "1.9.0.post1" # Altair static PNG export
    plotly: "6.9.0"

