# providers.yaml — locked BEFORE any results (git tag `prereg-v1`).
# All 6 providers per portfolio-edition roster (spec §3.1).
#
# `model` is NO LONGER in this file (defect 3.37). Model string is chosen
# per (provider, use_case) — several providers ship a low-latency model and
# a high-quality model, and a buyer would deploy the former for a support
# agent and the latter for narration. Model + voice + reasoning live in
# `voices.yaml`, keyed by (provider, use_case).

providers:
  - name: deepgram
    display_name: "Deepgram Aura-2"
    env_key: DEEPGRAM_API_KEY
    tier: control
    notes: >-
      Off-index control — a mid-tier enterprise-ASR shop that also
      ships TTS; conservative pick against which the newer entrants
      are compared. REST /v1/speak — per-request character limit
      ~2K, so long-stratum items chunk and reassemble with boundaries
      recorded in the manifest.

  - name: fish
    display_name: "Fish Audio S2.1-Pro"
    env_key: FISH_API_KEY
    tier: core
    notes: >-
      Free `s2.1-pro-free` window closes 2026-08-31 — runs first.
      Quality/WER on the free string; latency on the paid string
      (free-tier latency is best-effort). This provider has a split
      model per (provider, use_case) in voices.yaml — an on-chart
      annotation is required per defect 3.38. R9 task Phase C: confirm
      whether the two model strings share weights.

  - name: google
    display_name: "Google Cloud TTS Chirp3-HD"
    env_key: GOOGLE_API_KEY
    tier: core
    notes: >-
      Chirp3 HD is Google's flagship. Phase C — 15-minute probe:
      test streaming synthesis before committing to buffered REST
      (defect 3.15 — the "streaming is Preview only" claim from an
      earlier draft may be stale; streaming is documented as GA for
      Chirp3-HD as of 2025). If streaming works, D1 uses it and there
      is no non-comparability footnote. If it doesn't, D1 falls back
      to buffered REST with the footnote applied wherever Google TTFA
      appears.

  - name: cartesia
    display_name: "Cartesia Sonic-2"
    env_key: CARTESIA_API_KEY
    tier: core
    notes: >-
      Latency leader — the point on the frontier that trades quality
      for speed. Concurrency caps are low (2 free / 3 Pro); latency
      trials serialise anyway (D1 rule) and campaign concurrency
      capped to match. Header is `X-API-Key`.

  - name: elevenlabs
    display_name: "ElevenLabs Flash v2.5 + Multilingual v3"
    env_key: ELEVENLABS_API_KEY
    tier: core
    notes: >-
      Quality leader. Voice + model per use case in voices.yaml
      (typically Flash v2.5 for conversational / cost, Multilingual v3
      for narration / quality). Biggest single line item (~$22, one
      Creator month at 121K credits). Cancel after campaign. Header
      is `xi-api-key`.

  - name: orpheus
    display_name: "Orpheus 3B (Replicate — lucataco/orpheus-3b-0.1-ft fork)"
    # Adapter always uses the version-explicit endpoint /v1/predictions
    # with the pinned SHA in the body — the auto-latest
    # /v1/models/{owner}/{name}/predictions returns HTTP 404 for this
    # community model (verified 2026-08-07). Endpoint left unset;
    # adapter uses its DEFAULT_ENDPOINT constant.
    env_key: REPLICATE_API_TOKEN
    # Pinned version SHA — D-005 (prereg-v1.3). Bump requires a new
    # DEVIATIONS entry (drift accountability). Snapshot was 2026-08-07,
    # version created 2025-03-20.
    version: "79f2a473e6a9720716a473d9b2f2951437dbf91dc02ccb7079fb3d89b881207f"
    tier: core
    notes: >-
      Open-weights floor — "how close is free?" chart point. Replicate-
      hosted, billed per GPU-second (~$0.003/generation — defect 3.6
      corrected from an earlier $0.08 figure). D1 scored N/A-hosted
      (measures Replicate's cold start, not the model). Runs FULL
      10-item variance subset (spec §3.4). **The actual reachable
      Replicate deployment is `lucataco/orpheus-3b-0.1-ft`** — a
      community fine-tune of Canopy's open weights. Canopy has no
      official Replicate deployment; the pre-v1.1 slug
      `canopyai/orpheus-3b` returns 404. See DEVIATIONS D-004 and D-005
      for the amendment trail. Voice enum on the fork is 4
      (tara/dan/josh/emma) not 7. Licence to confirm Week 1: fine-tune
      inherits Canopy's Apache-2.0 (model card) vs Llama-3.2 community
      licence (comparison board) ambiguity.
      **Rate-limit warning:** Replicate reduces to 6 req/min with a
      burst of 1 until a payment method is added. Phase D's 900-item
      campaign requires the payment method.

  # Added in prereg-v1.1 (2026-08-07, DEVIATIONS.md D-003).
  - name: openai
    display_name: "OpenAI gpt-4o-mini-tts / gpt-4o-tts"
    env_key: OPENAI_API_KEY
    tier: core
    notes: >-
      LLM-ecosystem-default archetype: the API teams building
      GPT-adjacent products already have credentials for. Standard
      Bearer auth against POST /v1/audio/speech. Model + voice picked
      per use case in voices.yaml (gpt-4o-mini-tts for conversational
      latency; gpt-4o-tts for narration quality). Response is raw
      audio bytes (not JSON-wrapped). Added in prereg-v1.1.

  - name: speechify
    display_name: "Speechify Simba 3.2"
    env_key: SPEECHIFY_API_KEY
    tier: core
    notes: >-
      Consumer-storytelling / warm-narrator archetype. Speechify's
      Simba-3.2 targets audiobook + long-form content and is a
      distinct positioning from the enterprise/latency-optimised
      voices in the rest of the roster. Starter plan ($10/mo)
      required — free tier 50K chars/mo does not cover the campaign.
      Bearer auth. Added in prereg-v1.1.
