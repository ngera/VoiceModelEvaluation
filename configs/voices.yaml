# voices.yaml — locked voice AND model per provider × use case, with reasoning.
#
# Model moved here from providers.yaml (defect 3.37). Per spec §3.2:
# "The model string is selected the same way and locked the same way. Several
#  providers ship a low-latency model and a high-quality model, and a buyer
#  would deploy the former for a support agent and the latter for narration."
#
# Frozen in `prereg-v1`. Locking BEFORE any scoring prevents cherry-picking
# a voice/model after hearing results.
#
# `split_model_from_quality: true` marks providers where quality/WER and
# latency use DIFFERENT model strings (currently: Fish free vs paid).
# Requires an on-chart annotation per defect 3.38.
#
# Every entry below is a Phase-B DRAFT. Reasoning starting with `TODO:` must
# be replaced with a real one-liner from the provider's docs before
# `git tag prereg-v1`.

voices:
  # ============================================================
  # Deepgram — Aura-2 English voices, no cloning
  # ============================================================
  - provider: deepgram
    use_case: conversational
    voice_id: "aura-2-thalia-en"
    model: "aura-2-thalia-en"  # Deepgram encodes voice in model string
    reasoning: >-
      Thalia — warm mid-pitch English female voice from Deepgram's Aura-2
      lineup. User-verified 2026-08-07 as a conversational fit against
      Deepgram's voice catalogue.
  - provider: deepgram
    use_case: narration
    voice_id: "aura-2-orion-en"
    model: "aura-2-orion-en"
    reasoning: >-
      Orion — lower-pitch English male voice from Aura-2. User-verified
      2026-08-07 as a narration/documentary fit against Deepgram's
      catalogue.

  # ============================================================
  # Fish Audio — SPLIT MODEL: quality on free, latency on paid
  # ============================================================
  - provider: fish
    use_case: conversational
    voice_id: "9a9cf47702da476aa4629e2506d4a857"
    model: "s2.1-pro"  # LATENCY model
    split_model_from_quality: true
    quality_model: "s2.1-pro-free"
    reasoning: >-
      Fish quality/WER runs on the free `s2.1-pro-free` string (window
      closes 2026-08-31); latency runs on paid `s2.1-pro`, because
      free-tier latency is best-effort with no SLA. Voice_id
      user-selected 2026-08-07 from fish.audio English voice library as
      the conversational-tagged pick.
  - provider: fish
    use_case: narration
    voice_id: "e3cd384158934cc9a01029cd7d278634"
    model: "s2.1-pro"
    split_model_from_quality: true
    quality_model: "s2.1-pro-free"
    reasoning: >-
      Same split as conversational. Voice_id user-selected 2026-08-07
      from fish.audio English voice library as the
      narration/audiobook-tagged pick.

  # ============================================================
  # Google Cloud TTS — Chirp3-HD
  # ============================================================
  - provider: google
    use_case: conversational
    voice_id: "en-US-Chirp3-HD-Achernar"
    model: "en-US-Chirp3-HD-Achernar"  # Google encodes voice in name
    reasoning: >-
      Achernar — conversational/friendly voice from Google's Chirp3-HD
      English catalogue. User-verified 2026-08-07 against the current
      Google Cloud TTS voice list.
  - provider: google
    use_case: narration
    voice_id: "en-US-Chirp3-HD-Charon"
    model: "en-US-Chirp3-HD-Charon"
    reasoning: >-
      Charon — authoritative/narrative voice from Chirp3-HD.
      User-verified 2026-08-07 against the current Google catalogue.

  # ============================================================
  # Cartesia — Sonic-2 for conversational; possibly Sonic (base) for narration
  # ============================================================
  - provider: cartesia
    use_case: conversational
    voice_id: "db6b0ed5-d5d3-463d-ae85-518a07d3c2b4"
    model: "sonic-2"  # low-latency model — the natural pick for a support agent
    reasoning: >-
      Sonic-2 is Cartesia's latency-optimised model. Voice_id
      user-selected 2026-08-07 from play.cartesia.ai English voice
      library as the conversational-category pick.
  - provider: cartesia
    use_case: narration
    voice_id: "79f8b5fb-2cc8-479a-80df-29f7a7cf1a3e"
    model: "sonic-2"
    reasoning: >-
      Same model as conversational — Cartesia's current lineup does not
      ship a distinct higher-quality narration model. Voice_id
      user-selected 2026-08-07 from the English narration/audiobook
      category.

  # ============================================================
  # ElevenLabs — Flash v2.5 for conversational, Multilingual v3 for narration
  # ============================================================
  - provider: elevenlabs
    use_case: conversational
    voice_id: "g6xIsTj2HwM6VR4iXFCw"
    model: "eleven_flash_v2_5"  # low-latency model — right for a support agent
    reasoning: >-
      Flash v2.5 is ElevenLabs' latency-optimised model, the model a
      buyer would deploy for a support agent. Voice_id user-selected
      2026-08-07 from the ElevenLabs voice library, use case =
      Conversational.
  - provider: elevenlabs
    use_case: narration
    voice_id: "qSeXEcewz7tA0Q0qk9fH"
    model: "eleven_multilingual_v2"  # or eleven_multilingual_v3 when confirmed
    reasoning: >-
      Multilingual v2 (v3 if GA at time of run) is ElevenLabs'
      quality-optimised model — the model a buyer would deploy for
      long-form narration. This is a DIFFERENT model from the
      conversational entry above; the buyer would actually swap them
      per use case. Voice_id user-selected 2026-08-07 from the
      ElevenLabs voice library, use case = Narrative Story.

  # ============================================================
  # Canopy Orpheus — six default voices; same model, no low-latency variant
  # ============================================================
  - provider: orpheus
    use_case: conversational
    voice_id: "tara"
    model: "lucataco/orpheus-3b-0.1-ft"  # community fork — see DEVIATIONS D-004
    reasoning: >-
      Orpheus (as reached via Replicate) is `lucataco/orpheus-3b-0.1-ft`
      — a community fine-tune of Canopy's open weights (Canopy has no
      official Replicate deployment; the pre-v1.1 `canopyai/orpheus-3b`
      slug 404s). Voice enum on the fork is 4: tara/dan/josh/emma
      (verified via /v1/models schema 2026-08-07). Tara is Canopy's
      original sample voice and the only warm/general fit in the 4.
      Reference-implementation caveat: results measure this specific
      fine-tune, not pure Canopy weights. See DEVIATIONS D-004.
  - provider: orpheus
    use_case: narration
    voice_id: "dan"
    model: "lucataco/orpheus-3b-0.1-ft"
    reasoning: >-
      Same lucataco fine-tune. `leo` was picked pre-verification; the
      actual voice enum does not include `leo`. Swapped to `dan` — the
      best narrator archetype from the available 4 (tara/dan/josh/emma).
      Male voice mirrors the earlier "lower-pitch male for narration"
      selection intent. See DEVIATIONS D-004.

  # ============================================================
  # OpenAI (added prereg-v1.1, DEVIATIONS.md D-003)
  # Two use cases use DIFFERENT models per spec §3.2:
  #   gpt-4o-mini-tts for conversational (latency-optimised)
  #   gpt-4o-tts      for narration (quality-optimised)
  # ============================================================
  - provider: openai
    use_case: conversational
    voice_id: "fable"
    model: "gpt-4o-mini-tts"
    reasoning: >-
      gpt-4o-mini-tts is OpenAI's latency-optimised model — the model a
      buyer would deploy for a support agent. Voice_id user-selected
      2026-08-07 from OpenAI's English voice options as the
      conversational-fit pick.
  - provider: openai
    use_case: narration
    voice_id: "cedar"
    model: "tts-1-hd"  # D-006: gpt-4o-tts was 404 for this account (2026-08-08)
    reasoning: >-
      tts-1-hd is OpenAI's higher-quality standard TTS model — used
      by audiobook / narration pipelines where quality matters more
      than latency. Different model from the conversational entry
      above (gpt-4o-mini-tts); a buyer would swap them per use case.
      D-006 correction: the earlier pin on `gpt-4o-tts` was HTTP 404
      for this account — that model appears to be gated / not
      generally available. tts-1-hd IS available (confirmed via
      /v1/models 2026-08-08). Voice_id `cedar` unchanged (works on
      both models).

  # ============================================================
  # Speechify (added prereg-v1.1, DEVIATIONS.md D-003)
  # Simba 3.2 is Speechify's flagship model (HI #1 · score 99).
  # ============================================================
  - provider: speechify
    use_case: conversational
    voice_id: "geffen_32"
    model: "simba-3.2"
    reasoning: >-
      Simba 3.2 is Speechify's flagship model — the same model that
      earned HI's #1 rank (score 99). Only 8 of 956 voices in the
      Speechify library carry the simba-3.2 model (verified 2026-08-07
      via API /v1/voices). Selected `geffen_32` — en-US female, style
      "intriguing", timbre "warm" — the only voice in the 8 tagged with
      BOTH `use-case:conversational` AND `use-case:customer-service-ivr`.
      Direct fit for the support-agent archetype.
  - provider: speechify
    use_case: narration
    voice_id: "wyatt_32"
    model: "simba-3.2"
    reasoning: >-
      Same Simba 3.2 model. Selected `wyatt_32` — en-US male,
      middle-aged, style "sophisticated", timbre "textured". Tagged
      `narration` + `audiobook` + `audiobook-long-form`. Classic
      long-form narrator archetype. Different gender from the
      conversational pick reduces within-provider gender confounding
      across the two use cases.
