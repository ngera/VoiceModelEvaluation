# voices.T6.yaml — T6 verification-test-only overlay.
#
# **NOT PRE-REGISTERED.** This file is used exclusively by Phase 2c
# test T6 (Speechify voice-signature bias). It swaps the two Speechify
# voice_ids from the pre-registered picks (geffen_32 conv / wyatt_32
# narr) to `edmund_32` for BOTH use cases.
#
# See analysis/verification/T6_speechify_voice_bias.md for hypothesis
# and criterion. The rest of the file is a verbatim copy of
# configs/voices.yaml (locked prereg-v1.10) — all other providers'
# voices are unchanged so the run store is comparable if a full
# re-analysis is ever needed. In practice T6 only regenerates
# Speechify.
#
# Usage:
#   uv run veval generate --mode campaign --provider speechify \
#     --items ... --voices-file configs/voices.T6.yaml --no-cache
#
# **DO NOT** use this file for the actual campaign. It is
# .gitignore-adjacent conceptually — kept in git only so T6 evidence
# is reproducible.

voices:
  # ============================================================
  # Deepgram — Aura-2 English voices, no cloning  (UNCHANGED)
  # ============================================================
  - provider: deepgram
    use_case: conversational
    voice_id: "aura-2-thalia-en"
    model: "aura-2-thalia-en"
    reasoning: "See configs/voices.yaml — unchanged in T6 overlay."
  - provider: deepgram
    use_case: narration
    voice_id: "aura-2-orion-en"
    model: "aura-2-orion-en"
    reasoning: "See configs/voices.yaml — unchanged in T6 overlay."

