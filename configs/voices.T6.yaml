  # ============================================================
  # Speechify — T6 SWAP: geffen_32/wyatt_32 → edmund_32 for both UCs
  # ============================================================
  - provider: speechify
    use_case: conversational
    voice_id: "edmund_32"     # T6 swap (original: geffen_32)
    model: "simba-3.2"
    reasoning: >-
      T6 alternate voice — see
      analysis/verification/T6_speechify_voice_bias.md. edmund_32 is
      en-GB male young-adult pitch:high timbre:bright style:dynamic,
      tagged for use-case:conversational among other tags. Original
      was geffen_32 (en-US female intriguing warm) — big-signature
      swap by design to test whether Audiobox's Speechify #1 ranking
      is voice-signature-specific or Simba-3.2-model-signature.
  - provider: speechify
    use_case: narration
    voice_id: "edmund_32"     # T6 swap (original: wyatt_32)
    model: "simba-3.2"
    reasoning: >-
      T6 alternate voice — same edmund_32 voice used across both use
      cases so the two comparisons hold voice constant while the
      reference (geffen_32 / wyatt_32) varies. Original was wyatt_32
      (en-US male middle-aged low-pitch textured sophisticated) —
      moderate-signature swap (still male, different accent + pitch +
      timbre + age). See T6 scaffold for interpretation framework.
