[project]
name = "veval"
version = "0.1.0"
description = "Voice AI provider evaluation harness (portfolio edition)"
readme = "CLAUDE.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Analyzer deps are Linux/CUDA-first. Install inside the devcontainer only.
analyze = [
    "jiwer>=3.0",
    "faster-whisper>=1.0",
    "silero-vad>=5.1",
    "pyloudnorm>=0.1.1",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
    # VERSA, NeMo (Parakeet), TTSDS2, Audiobox pinned via Dockerfile due to
    # non-PyPI or heavy install patterns; see .devcontainer/Dockerfile.
]
admin = [
    "streamlit>=1.36",
    "plotly>=5.22",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",  # mypy strict needs stubs for the config loaders
]

[project.scripts]
veval = "veval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008 fires on typer's core idiom (`x: T = typer.Option(...)`), where the call
# in the default is required by the framework, not a mutable-default bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
