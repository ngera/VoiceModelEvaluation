[project]
name = "veval"
version = "0.1.0"
description = "Voice AI provider evaluation harness (portfolio edition)"
readme = "CLAUDE.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Analyzer stack. Native Windows works throughout (v2 plan) — VERSA and
# NeMo are gone; every dep here has Windows wheels. GPU strongly recommended.
# Parakeet loaded via HuggingFace `transformers` (RNNT release; TDT re-check
# per analyzers.yaml). faster-whisper via CTranslate2. TTSDS2 + Audiobox
# Aesthetics via their PyPI packages.
analyze = [
    "jiwer>=3.0",
    "faster-whisper>=1.0",
    "silero-vad>=5.1",
    "pyloudnorm>=0.1.1",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
    # Upper bounds: ttsds pulls in s3prl/wespeaker which use
    # `torchaudio.set_audio_backend()` — removed in torchaudio 2.x newer
    # revisions. transformers 5.x has breaking API changes vs the ttsds
    # dep contract. Pinned below those cliffs; re-check on drift re-run.
    "torch>=2.2,<2.5",
    "torchaudio>=2.2,<2.5",
    "transformers>=4.44,<5.0",
    "ttsds>=2.1",           # TTSDS2 ships under the `ttsds` PyPI name (2.x = TTSDS2)
    "audiobox-aesthetics>=0.0.4",
    "choix>=0.4",           # Bradley-Terry (spec §4.3, borrow-not-build per spec §5)
]
admin = [
    "streamlit>=1.36",
    "plotly>=5.22",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",  # mypy strict needs stubs for the config loaders
]

[project.scripts]
veval = "veval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008 fires on typer's core idiom (`x: T = typer.Option(...)`), where the call
# in the default is required by the framework, not a mutable-default bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
