      package will be funded partly through a windfall tax on energy
      companies, which the government is extending for a further two years.
      Several energy firms said they would review planned investment in
      domestic production following the announcement. We'll have more on
      this story throughout the evening. Now let's go to our economics
      correspondent James Okafor, who is outside the Treasury.

  - id: L04
    stratum: long
    word_count: 269
    tags: [src:rescued, src:h1:Educational and Instructional, src:id:L01, register:educational, domain:education]
    text: >-
      Lesson 4: Understanding the Water Cycle. Water is constantly moving
      around our planet in a cycle — from the surface up into the atmosphere
      and back down again. This is called the water cycle, or the
      hydrological cycle, and it has been happening for billions of years.
      Let's start with evaporation. When the sun heats water in oceans,
      lakes, and rivers, some of that water turns into water vapour — a gas
      — and rises into the air. Oceans are the main source of evaporated
      water, which makes sense when you think about how much of the Earth's
      surface they cover. As the water vapour rises, it enters cooler parts
      of the atmosphere. When warm, moist air cools down, the water vapour
      condenses — meaning it turns back into tiny liquid droplets. These
      droplets collect together to form clouds. You might have noticed that
      clouds often form at a certain altitude — that's because that's the
      point where the rising air has cooled just enough for condensation to
      begin. When enough droplets collect in a cloud, they become too heavy
      to stay suspended in the air, and they fall as precipitation — which
      is rain, snow, sleet, or hail depending on the temperature. Some of
      this precipitation flows into rivers and streams and eventually back
      to the sea. Some of it soaks into the ground and becomes groundwater.
      And some of it falls as snow on high mountains and stays frozen for
      months or even years before slowly melting. And then the whole cycle
      begins again. Every glass of water you drink has been through this
      cycle countless times.

