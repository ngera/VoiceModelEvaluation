  - id: L01
    stratum: long
    word_count: 233
    tags: [src:source, src:h1:Book and Long-Form Narration, src:id:L01, register:fiction, domain:fiction]
    text: >-
      The town of Alderly had three churches, two pubs, and one secret that
      everyone knew but no one spoke about out loud. The churches were old and
      cold and smelled of damp hymnals. The pubs were warm and loud and smelled
      of everything else. The secret — well, the secret smelled of the sea,
      even though the sea was forty miles away, which was part of what made it
      strange. Margaret Holt had lived on the high street for sixty-two years.
      She had watched the elm trees grow and die and be replaced with saplings
      that were now, themselves, beginning to look like trees. She had watched
      the post office become a letting agency and the letting agency become a
      coffee shop and the coffee shop become, briefly, a yoga studio before it
      became a coffee shop again. She had watched the secret pulse through the
      town like a second heartbeat, quiet but constant, something the young
      people thought they'd discovered and the old people knew had always been
      there. Her granddaughter Rosie had come to visit for the summer, which
      was part of why Margaret was sitting now at the kitchen window, watching
      the garden and waiting. Rosie was seventeen and curious in the way that
      seventeen always is — not curious about answers, but about the questions
      themselves, which is a kind of courage Margaret had spent decades trying
      to relearn.

  - id: L02
    stratum: long
    word_count: 216
    tags: [src:source, src:h1:Book and Long-Form Narration, src:id:L02, register:fiction, domain:fiction]
    text: >-
      Chapter Four: The Last Map. There is a map in the British Library that
      is wrong in a way that can only be described as deliberately wrong. It
      was drawn in 1602 by a cartographer whose name has been lost, which is
      itself suspicious, since cartographers of that period were meticulous
      about attribution. The map shows the eastern coast of an island that
      does not exist. The island is rendered in extraordinary detail — bays,
      inlets, a river that curves south before turning back on itself, a
      mountain with a notation in Latin that translates, roughly, as 'here
      the light is different.' On the reverse side of the map, in a hand
      that appears to be different from the cartographer's, someone has
      written: 'I have been here.' Dr. Evelyn Cross had been studying this
      map for eleven years. She had examined it under ultraviolet light,
      under infrared imaging, under a microscope powerful enough to count
      the individual fibres of the vellum. She had traced the coastline
      against every known island in every ocean and found nothing. She had
      run the Latin text through six different translation tools and
      received six slightly different answers, all of which agreed on
      'light' and disagreed on everything else. Today, for reasons she
      couldn't fully explain, she thought she was close.

