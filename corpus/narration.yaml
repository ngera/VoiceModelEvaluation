  - id: L08
    stratum: long
    word_count: 227
    tags: [src:authored, register:travel-documentary, domain:travel]
    text: >-
      There is a village in the western Highlands where the shore road ends
      at a cattle grid, and beyond the cattle grid there is only heather,
      sea, and the sound of curlews. The village is called Applecross,
      though on the older maps and in the older Gaelic it was A' Chomraich
      — meaning the sanctuary. In the eighth century a monk called
      Maelrubha came here from Bangor and founded a monastery whose stones
      lie now under the churchyard grass. What he built was more than a
      monastery. It was a place of refuge, marked by four crosses at the
      compass points, and any fugitive who reached them, whatever the
      crime, could not be pursued within their circle. This right of
      sanctuary held for a thousand years, and was still recognised into
      the seventeenth century, when Highland courts continued to
      acknowledge the boundary even as they otherwise wielded a punishing
      law. Today the crosses are gone, or perhaps buried, and the road
      ends where the road ends. But in the way that certain landscapes
      hold memory in their weather — the sudden hush that falls when you
      turn the last bend, the sense that the light has changed in some
      quiet, deliberate way — something of the sanctuary is still there,
      waiting for the traveller who thinks they have arrived, and finds
      instead that they have been received.

