      of your current medications, your hospital card, and any previous
      endoscopy reports if you have them. After the procedure: You will be
      in recovery for approximately 45 minutes while the sedation wears off.
      You must have a responsible adult available to take you home — you
      cannot travel by taxi or public transport alone, and you must not
      drive for 24 hours. You may feel bloated or gassy for a few hours
      after the procedure — this is normal.

