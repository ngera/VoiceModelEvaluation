# conversational.yaml — pre-registered corpus for the conversational
# support-agent use case (spec §3.1, §3.3). Frozen in `prereg-v1`.
#
# Target: 75 items = 12 short + 20 medium + 8 long + 12 jargon + 8 edge + 15 probe.
# This file is built up batch-by-batch during Phase B; final tag lands after
# all strata are approved and the variance subset is selected.
#
# Item IDs are stable across the campaign — never renumbered after prereg.
#
# Tag semantics:
#   src:source        — used directly from documentation/archive/voice_ai_test_corpus.docx
#   src:authored      — written fresh during Phase B corpus authoring
#   src:public-domain — probe items drawn from public-domain sources
#   src:h1:*, src:h2:*, src:id:*  — extractor provenance (parent's H1/H2/id marker)

use_case: conversational
items:

  # ============================================================
  # LONG stratum (8 items, > 200 words) — batch 1a, approved 2026-08-07
  # ============================================================

  - id: L01
    stratum: long
    word_count: 255
    tags: [src:source, src:h1:Conversational Agent, src:id:L01, domain:retail, register:support-call]
    text: >-
      Thank you for calling Premier Support. My name is Alex and I'll be helping
      you today. I can see you've been a customer since 2019 — thank you for
      your loyalty. Could I start by verifying your account? I'll need either
      your account number or the phone number associated with the account.
      Great, thank you. I can see your account now. You mentioned you're having
      trouble with your recent order. Let me pull that up. I'm looking at order
      number 77341, placed on the 8th of this month for a wireless keyboard and
      mouse bundle. Is that the one you're calling about? I see the issue. The
      package was marked as delivered on the 11th, but based on your address,
      it looks like it may have been left with a neighbour or in a mailroom.
      Before I raise a missing item claim, I'd recommend checking with your
      building reception or any nearby neighbours, as the carrier photo shows
      it was placed near a blue door. If you've already done that and it's
      still missing, I can file a trace with the carrier — that takes up to
      five business days — or I can send a replacement right away with priority
      shipping at no charge. The replacement would arrive within two business
      days. Which would you prefer? I'll go ahead and process the replacement.
      You'll receive a confirmation email within the next hour with the new
      tracking number. Is the delivery address the same as before, or would
      you like to ship it somewhere different?

  - id: L02
    stratum: long
    word_count: 236
    tags: [src:source, src:h1:Conversational Agent, src:id:L02, domain:finance, register:support-call]
    text: >-
      I understand you've been waiting on hold and I appreciate your patience.
      Let me make sure I have everything I need to resolve this for you today
      so you don't have to call back. You're asking about the double charge on
      your account from the 15th. I can see two transactions here — one for
      $42.50 and another for $42.50 posted eight minutes apart. That does look
      like a duplicate. What likely happened is that the payment page timed out
      on your end and the request was submitted twice before the system caught
      it. I'm going to reverse the second charge now. The reversal will show
      as a pending credit within 24 hours and the funds will fully clear in
      three to five business days depending on your bank. I'd also recommend
      checking if your bank placed a hold — sometimes both charges remain
      visible during processing even after we've reversed one on our end. I'm
      also going to add a note to your account so that if you call back and
      the credit hasn't appeared by Friday, the next agent can escalate it
      directly to our payments team without you needing to explain everything
      again. Is there anything else I can help you with today? I also notice
      your subscription is due for renewal next month — would you like me to
      go over your current plan and any available upgrades while I have you?

  - id: L03
    stratum: long
    word_count: 232
    tags: [src:authored, topic:tech-support-wifi, domain:tech]
    text: >-
      Thanks for calling. I understand your internet's been dropping
      intermittently over the past few days. Before we dig in, let me confirm
      a few things about your setup. You're on our Fibre 500 plan, is that
      right? And the modem is the one we shipped in September — the black one
      with three green lights on the front. Good. First, I'd like you to look
      at those lights right now. Are all three of them solid green, or is any
      of them blinking, off, or a different colour? Okay, so the middle light
      is amber. That's actually really helpful — amber on the middle indicator
      means the modem is reaching the local exchange but not receiving a
      stable authentication response. That points to something in our network
      rather than in your home, which is good news for you. Let me check the
      line status from my end. I'm seeing three brief drops in the last
      twenty-four hours, each lasting between forty seconds and two minutes.
      That matches what you described. There's a scheduled maintenance window
      that ran on your exchange overnight — the drops are consistent with the
      recovery pattern after that kind of work. I'm going to flag this to
      network engineering as a post-maintenance stability issue and open a
      ticket in your name. Reference number is going to be TS-4482-91. You
      should see stability return within twelve to twenty-four hours.

  - id: L04
    stratum: long
    word_count: 239
    tags: [src:authored, topic:insurance-claim-intake, domain:insurance]
    text: >-
      First of all, I'm sorry to hear about the accident — I hope you and
      everyone involved are okay. Take your time. I'm going to walk you
      through what we need to get a claim opened, but there's no rush. When
      you're ready, could you tell me the date and approximate time of the
      incident? Okay, Sunday afternoon around four. And where did it happen —
      I don't need the exact address if you don't have it, just the road or
      the nearest intersection. The junction of Elm Street and Fourth Avenue,
      got it. Was anyone injured, either in your vehicle or the other vehicle?
      I'm glad to hear it. Now, do you have the other driver's insurance
      information — company name, policy number, and their contact details?
      If not, that's fine, we can request it through the exchange process.
      And did the police attend the scene? If they did, was a report number
      issued? Perfect, I've noted case number seven-two-two-nine-eight from
      Metro Police. I have enough now to open your claim under file number
      CL-2026-8734. Your assigned adjuster will call you within one business
      day. In the meantime, if you have photographs of the vehicles or the
      scene, please email them to claims@example.com with your file number in
      the subject line. Do not have your vehicle repaired before speaking to
      the adjuster, unless it's a safety issue — is there anything about the
      current condition that can't wait?

  - id: L05
    stratum: long
    word_count: 228
    tags: [src:authored, topic:subscription-cancellation-retention, domain:media]
    text: >-
      I understand you're looking to cancel your subscription today. Before I
      process that, would it be alright if I ask a couple of quick questions?
      It'll help us improve the service, and there may be an option I can
      offer you that saves you some money. You've been with us on the Premium
      plan for about eighteen months. Are you cancelling because the service
      isn't meeting your needs, or is it more about the cost? Okay, that's
      helpful — cost is understandable, especially with everything going up
      right now. Let me see what's available on your account. I can see you
      use the streaming feature quite heavily but haven't touched the offline
      downloads in the last six months. We have a Streaming-Only plan at
      $8.99 a month, down from your current $15.99, that gives you everything
      you actually use with no interruption to your library or your watch
      history. Would that be something you'd like to try, or would you still
      prefer to cancel completely? If you'd rather test it for a month before
      committing, I can put a note on your account so you can switch back to
      Premium any time in the first thirty days at no charge. That way
      there's no risk. Which would you like to do? Great, I've moved you to
      Streaming-Only effective the start of your next billing cycle on the 3rd.

  - id: L06
    stratum: long
    word_count: 227
    tags: [src:authored, topic:return-wrong-size, domain:retail]
    text: >-
      Thanks for calling, and I'm really sorry for the mix-up. I can see on
      your order that you selected the medium, and what shipped was a large.
      That's on us. Let me get the exchange started for you right now. I've
      put a return label in your account under the order — you'll get an
      email in the next few minutes with the label attached. You can print
      it at home or take the barcode to any drop-off location; we've got
      about four thousand of them across the country, so there should be
      one close to you. You don't need to package it in the original box,
      but do please include the original invoice or a note with your order
      number. On the exchange side, I've reserved a medium in the same
      colour and style, and I'm going to expedite the shipping so it arrives
      before you send the large back. That way you're not waiting. You should
      see the medium delivered within two business days. The system will
      automatically match the return to the exchange, so you won't be
      charged again — but if you do see a pending charge on your account
      before the return processes, it'll fall off within about a week. Is
      there anything else about this order I should look at, or is there
      anything else I can help you with today?

  - id: L07
    stratum: long
    word_count: 250
    tags: [src:authored, topic:security-2fa-reset, domain:security]
    text: >-
      Thanks for calling. I understand you're locked out of your account and
      the reset link isn't reaching your two-factor device. I'll help you get
      back in, but I do need to walk through our identity verification
      carefully — this is exactly the situation attackers try to exploit, so
      please bear with me. Can you confirm the email address on the account
      for me? And can you tell me the last four digits of the payment method
      we have on file? Okay, that matches. Now, we need to establish that
      the person on this call is the account holder rather than someone with
      the email and card details. I'm going to ask two questions from your
      account history that only you should be able to answer. First: what
      city was the account originally registered from? And second: what was
      the approximate amount of your most recent completed transaction,
      within five dollars? Both correct. Thank you for going through that.
      What I'm going to do now is reset your two-factor device pairing rather
      than the password itself — you'll receive a verification email and,
      once you click it, you'll be prompted to enrol a new authenticator.
      Once that's done, your existing password will still work; if you'd
      prefer to change it as well, you can do so from account settings after
      logging in. The reset email will arrive within five minutes. If it
      doesn't, check your spam folder, and if it's still not there, call us
      back and reference case number SEC-9917-42.

  - id: L08
    stratum: long
    word_count: 233
    tags: [src:authored, topic:flight-rebooking, domain:travel]
    text: >-
      I'm really sorry about the cancellation — I know that's the last thing
      you need on a Sunday evening. Let me pull up your booking. I see
      reference JXQ4T2, flight 447 from Manchester to Malaga, originally
      departing at seven-fifteen tomorrow morning. That's been cancelled, and
      I have three options I can offer you. The first is our nine-forty
      flight tomorrow morning, same route, seats in economy and one exit-row
      seat available. The second is a rerouting through Barcelona, leaving at
      six a.m., landing you in Malaga just after two in the afternoon —
      longer travel time but no risk of being bumped, since both legs are
      already ticketed. The third option is a next-day departure, direct at
      seven-thirty on Tuesday morning, with hotel accommodation and meal
      vouchers provided by us at no charge if the delay of a day is too
      disruptive. If you're travelling on a fixed schedule and same-day
      matters, I'd recommend the nine-forty — you'd land only about two hours
      later than originally planned. Which would work best for you? I've
      moved you to the nine-forty. Your new boarding pass will be issued to
      the app automatically, and you'll need to be at the gate no later than
      nine-ten. If you'd like, I can also arrange a small compensation credit
      for the disruption — it's a hundred and twenty euros in travel credit,
      valid for twelve months. Is that useful?

